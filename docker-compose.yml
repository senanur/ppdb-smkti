# docker-compose.yml
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel7_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel7

  nginx:
    image: nginx:alpine
    container_name: laravel7_nginx
    restart: unless-stopped
    ports:
      - "8074:80"  # External port 8074 to avoid conflicts
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - laravel7
    depends_on:
      - app

  mysql:
    image: mysql:5.7
    container_name: laravel7_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33074:3306"  # External port to avoid conflicts
    networks:
      - laravel7

  redis:
    image: redis:6-alpine
    container_name: laravel7_redis
    restart: unless-stopped
    ports:
      - "63794:6379"
    networks:
      - laravel7

networks:
  laravel7:
    driver: bridge

volumes:
  mysql_data:
    driver: local
